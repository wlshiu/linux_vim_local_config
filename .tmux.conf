
#//======================================================================
#// rebind hotkey
#//======================================================================

#
# 要先執行完 prefix-key 再按其他指令, 不要一起按
# prefix-key: 'ctrl + b'
#

#//---------------------------
#// remap prefix-key (C-a to replace C-b)
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

#//---------------------------
#// prefix-key + r 直接讓 tmux 吃到設定而不用重開 tmux
#// reload config without killing server
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

#//---------------------------
#// 分割 window
#// "|" splits the current window vertically, and "-" splits it horizontally
unbind %
bind | split-window -h
bind - split-window -v

#//---------------------------
#// Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#//---------------------------
#// Pane resizing
# bind -r Left  resize-pane -L 4
# bind -r Down  resize-pane -D 4
# bind -r Up    resize-pane -U 4
# bind -r Right resize-pane -R 4

# shift + 方向鍵
bind -n S-Left  resize-pane -L 4
bind -n S-Down  resize-pane -D 4
bind -n S-Up    resize-pane -U 4
bind -n S-Right resize-pane -R 4
#//======================================================================
#// theme
#//======================================================================

#//---------------------------
#// display things in 256 colors
set -g default-terminal "screen-256color"
# set -g default-terminal "tmux-256color"

#//---------------------------
#// statusbar
set -g status-position bottom
# set -g status-justify left
# set -g status-style 'fg=colour1'
# set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
# set -g status-right-length 50
# set -g status-left-length 10
# setw -g window-status-current-format ' #I #W #F '
#//======================================================================
#// other options
#//======================================================================

#//---------------------------
#// set the shell you like (bash, "which bash" to find the path)
# set -g default-command /bin/bash
# set -g default-shell /bin/bash

#//---------------------------
#// use UTF8
# set -g utf8
# set-window-option -g utf8 on


#//---------------------------
#// mouse is great! 使用滑鼠
#// 自動複製滑鼠選取的文字
set-option -g mouse on

#//---------------------------
#// history size
set -g history-limit 20000

#//---------------------------
#// index 從 1 開始數
#// 0 is too far
set -g base-index 1
setw -g pane-base-index 1

#//---------------------------
#// fix delay
set -g escape-time 0

#//---------------------------
#// stop auto renaming
setw -g automatic-rename off
set-option -g allow-rename off

#//---------------------------
#// renumber windows sequentially after closing
set -g renumber-windows on

#//---------------------------
#// window notifications; display activity on other window
setw -g monitor-activity on
set -g visual-activity on

